  <script type="module" src="/@vite/client"></script>

    <meta charset="UTF-8">
    <meta id="appViewportMeta" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0b0e14">
    <title>MovieApp.in - Home Page Movie Section</title>
    <meta name="description" content="MovieApp.in - Fast movie portal with Plyr video player, multi-server stream resolver, horizontal scrolling, and web series playlist.">
    <meta property="og:title" content="MovieApp.in - Fast Movie Portal">
    <meta property="og:description" content="MovieApp.in - Fast movie portal with Plyr video player, multi-server stream resolver, horizontal scrolling, and web series playlist.">

    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Plyr Video Player CSS & JS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plyr/3.7.8/plyr.polyfilled.min.js"></script>

    <style>
        /* ====================================================
           RESET & GLOBAL THEME
           ==================================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: #0b0e14;
            color: #f3f4f6;
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Hide scrollbars across all browsers while keeping smooth momentum scroll */
        *::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }

        /* ====================================================
           PLYR PLAYER CUSTOM STYLING (Cyan #00d2ff Accent)
           ==================================================== */
        :root {
            --plyr-color-main: #00d2ff;
            --plyr-video-background: #000000;
            --plyr-video-control-color: #ffffff;
            --plyr-video-control-color-hover: #00d2ff;
            --plyr-video-control-background-hover: rgba(0, 210, 255, 0.2);
            --plyr-control-icon-size: 16px;
            --plyr-control-spacing: 10px;
            --plyr-range-thumb-height: 14px;
            --plyr-range-track-height: 5px;
            --plyr-badge-text-color: #0b0e14;
            --plyr-badge-background: #00d2ff;
        }

        .plyr--video {
            width: 100% !important;
            height: 100% !important;
            border-radius: 12px;
            background: #000000;
        }

        .plyr--video .plyr__controls {
            background: linear-gradient(rgba(0, 0, 0, 0), rgba(0, 0, 0, 0.88));
            padding: 12px 14px;
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
        }

        .plyr__control--overlaid {
            background: rgba(0, 210, 255, 0.9) !important;
            color: #0b0e14 !important;
            box-shadow: 0 0 24px rgba(0, 210, 255, 0.6);
            transform: scale(1.05);
            transition: all 0.2s ease;
        }

        .plyr__control--overlaid:hover {
            background: #00d2ff !important;
            transform: scale(1.15);
        }

        .plyr__control--overlaid svg {
            fill: #0b0e14 !important;
        }

        .video-box-wrapper .plyr {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* ====================================================
           STICKY HEADER & SEARCH BAR
           ==================================================== */
        .header-container {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(11, 14, 20, 0.95);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.25s ease;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            color: #ffffff;
            font-size: 19px;
            font-weight: 800;
            letter-spacing: -0.3px;
            cursor: pointer;
            white-space: nowrap;
            user-select: none;
        }

        .brand-logo i {
            color: #e50914;
            font-size: 20px;
            filter: drop-shadow(0 0 8px rgba(229, 9, 20, 0.6));
        }

        .brand-logo span.accent {
            color: #00d2ff;
        }

        .search-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            background: #151a24;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 4px 12px;
            transition: all 0.2s ease;
          width: 55%;
        }

        .search-wrapper:focus-within {
            border-color: #00d2ff;
            background: #182030;
            box-shadow: 0 0 14px rgba(0, 210, 255, 0.25);
        }

        .search-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 13.5px;
            font-family: inherit;
            padding: 6px 8px;
            min-width: 80px;
        }

        .search-input::placeholder {
            color: #8b949e;
            font-size: 13px;
        }

        .search-clear-btn {
            background: none;
            border: none;
            color: #8b949e;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            display: none;
            transition: color 0.15s;
        }

        .search-clear-btn:hover {
            color: #ffffff;
        }

        .mic-btn {
            background: none;
            border: none;
            color: #00d2ff;
            font-size: 15px;
            cursor: pointer;
            padding: 4px 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .mic-btn.listening {
            color: #ff3b30;
            animation: pulseRecord 1s infinite alternate;
        }

        @keyframes pulseRecord {
            from { transform: scale(1); filter: drop-shadow(0 0 4px #ff3b30); }
            to { transform: scale(1.2); filter: drop-shadow(0 0 12px #ff3b30); }
        }

        .menu-btn {
            background: #1c2434;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 7px 12px;
            border-radius: 18px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .menu-btn:hover {
            background: #253147;
            border-color: #00d2ff;
            color: #00d2ff;
        }

        .download-code-btn {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.18), rgba(0, 114, 255, 0.22));
            border: 1px solid #00d2ff;
            color: #ffffff;
            padding: 7px 13px;
            border-radius: 18px;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            text-decoration: none;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.25);
        }

        .download-code-btn:hover {
            background: #00d2ff;
            color: #0b0e14;
            box-shadow: 0 0 16px rgba(0, 210, 255, 0.6);
            transform: translateY(-1px);
        }

        /* ====================================================
           QUICK CATEGORY PILLS BAR (HORIZONTAL SCROLL)
           ==================================================== */
        .category-pills-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 14px;
            background: #0f131c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            -webkit-overflow-scrolling: touch;
        }

        .cat-pill {
            flex-shrink: 0;
            background: #182030;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .cat-pill:hover {
            background: #202b40;
            color: #ffffff;
            border-color: rgba(0, 210, 255, 0.4);
        }

        .cat-pill.active {
            background: #00d2ff;
            color: #0b0e14;
            border-color: #00d2ff;
            font-weight: 700;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
        }

        /* ====================================================
           MAIN MOVIE CONTENT & HORIZONTAL ROWS
           ==================================================== */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 5px 5px 5px 5px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
            padding-right: 4px;
        }

        .section-title-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-bar {
            width: 4px;
            height: 18px;
            background: #00d2ff;
            border-radius: 4px;
            box-shadow: 0 0 8px rgba(0, 210, 255, 0.6);
        }

        .section-bar.fire {
            background: #e50914;
            box-shadow: 0 0 8px rgba(229, 9, 20, 0.8);
        }

        .section-title {
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.2px;
        }

        .section-count-badge {
            font-size: 11px;
            font-weight: 600;
            color: #8b949e;
            background: #182030;
            padding: 2px 7px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .show-all-btn {
            background: none;
            border: none;
            color: #00d2ff;
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.15s ease;
        }

        .show-all-btn:hover {
            color: #ffffff;
            background: rgba(0, 210, 255, 0.15);
        }

        /* Smooth horizontal scrolling container */
        .horizontal-scroll-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            padding-top: 4px;
            -webkit-overflow-scrolling: touch;
            scroll-snap-type: x mandatory;
        }

        /* Movie Card Component */
        .movie-card {
            flex: 0 0 135px;
            width: 135px;
            scroll-snap-align: start;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            border-radius: 12px;
            position: relative;
            user-select: none;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.22s ease;
        }

        @media (min-width: 640px) {
            .movie-card {
                flex: 0 0 155px;
                width: 155px;
            }
        }

        @media (min-width: 1024px) {
            .movie-card {
                flex: 0 0 170px;
                width: 170px;
            }
        }

        .movie-card:hover {
            transform: translateY(-4px);
        }

        .movie-card-thumb-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 2 / 3;
            border-radius: 10px;
            overflow: hidden;
            background: #151a24;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .movie-card:hover .movie-card-thumb-wrap {
            border-color: rgba(0, 210, 255, 0.5);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.7), 0 0 12px rgba(0, 210, 255, 0.2);
        }

        .movie-card-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.35s ease;
        }

        .movie-card:hover .movie-card-thumb-wrap img {
            transform: scale(1.05);
        }

        /* Play Overlay Icon */
        .movie-play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .movie-card:hover .movie-play-overlay {
            opacity: 1;
        }

        .movie-play-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(229, 9, 20, 0.9);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 16px rgba(229, 9, 20, 0.7);
            transform: scale(0.9);
            transition: transform 0.2s ease;
        }

        .movie-card:hover .movie-play-icon {
            transform: scale(1.08);
        }

        /* Badges */
        .rating-badge {
            position: absolute;
            top: 7px;
            left: 7px;
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 215, 0, 0.4);
            color: #ffd700;
            font-size: 10.5px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
            backdrop-filter: blur(4px);
        }

        .series-badge {
            position: absolute;
            top: 7px;
            right: 7px;
            background: rgba(229, 9, 20, 0.9);
            color: #ffffff;
            font-size: 9.5px;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 4px;
            z-index: 2;
            box-shadow: 0 2px 6px rgba(0,0,0,0.6);
            letter-spacing: 0.3px;
        }

        .new-tag {
            color: #00ff88;
            font-weight: 800;
            margin-right: 3px;
        }

        .category-tag {
            position: absolute;
            bottom: 7px;
            left: 7px;
            background: rgba(0, 210, 255, 0.85);
            color: #0b0e14;
            font-size: 9.5px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 3px;
            z-index: 2;
            max-width: calc(100% - 14px);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Continue Watching Card Accents */
        .resume-badge {
            position: absolute;
            top: 7px;
            left: 7px;
            background: linear-gradient(135deg, #00d2ff, #0072ff);
            color: #0b0e14;
            font-size: 9.5px;
            font-weight: 800;
            padding: 2.5px 6.5px;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            z-index: 2;
            letter-spacing: 0.5px;
            box-shadow: 0 2px 8px rgba(0, 210, 255, 0.45);
        }

        .continue-progress-bar-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 3;
        }

        .continue-progress-bar-fill {
            height: 100%;
            width: 68%;
            background: linear-gradient(90deg, #00d2ff, #38ef7d);
            border-top-right-radius: 2px;
            border-bottom-right-radius: 2px;
            box-shadow: 0 0 6px #00d2ff;
        }

        .remove-continue-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #94a3b8;
            font-size: 11px;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .remove-continue-btn:hover {
            background: #ff3b30;
            color: #ffffff;
            transform: scale(1.15);
        }

        /* Title Box */
        .movie-title-box {
            padding: 6px 2px 2px 2px;
        }

        .movie-title {
            font-size: 12.5px;
            font-weight: 600;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.35;
        }

        .movie-card:hover .movie-title {
            color: #00d2ff;
        }

        .movie-cast-sub {
            font-size: 10.5px;
            color: #8b949e;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 1px;
        }

        /* ====================================================
           FULL CATEGORY GRID VIEW (SHOW ALL VIEW)
           ==================================================== */
        .category-grid-view {
            display: none;
            animation: fadeIn 0.25s ease-out;
        }

        .grid-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grid-back-btn {
            background: #182030;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 7px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .grid-back-btn:hover {
            background: #202b40;
            border-color: #00d2ff;
            color: #00d2ff;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 14px 10px;
        }

        @media (min-width: 640px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
                gap: 18px 14px;
            }
        }

        @media (min-width: 1024px) {
            .movies-grid {
                grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
                gap: 20px 16px;
            }
        }

        .movies-grid .movie-card {
            width: 100%;
            flex: none;
        }

        /* ====================================================
           MODAL MOVIE VIDEO PLAYER VIEW
           ==================================================== */
        .player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 9, 14, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 2000;
            display: none;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .player-top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: #0f131c;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .player-back-btn {
            background: #182030;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .player-back-btn:hover {
            background: #222d42;
            color: #00d2ff;
            border-color: #00d2ff;
        }

        .player-content-wrap {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 14px 14px 60px 14px;
        }

        .video-box-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000000;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 25px rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .video-box-wrapper iframe,
        .video-box-wrapper video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: #000000;
        }

        /* ====================================================
           WEB SERIES PLAYLIST / EPISODES SECTION
           ==================================================== */
        .playlist-section {
            margin-top: 14px;
            background: #121722;
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 14px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .playlist-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .playlist-title-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
        }

        .playlist-title-wrap i {
            color: #00d2ff;
        }

        .playlist-count-badge {
            background: rgba(0, 210, 255, 0.15);
            border: 1px solid rgba(0, 210, 255, 0.35);
            color: #00d2ff;
            font-size: 11px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .playlist-nav-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .ep-nav-btn {
            background: #1a2232;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #cbd5e1;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .ep-nav-btn:hover:not(:disabled) {
            background: #222d42;
            color: #00d2ff;
            border-color: #00d2ff;
        }

        .ep-nav-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .playlist-now-playing {
            display: flex;
            align-items: center;

        /* ====================================================

        // Extracts and cleans Google Drive ID by stripping any trailing extra character or word
        function cleanGoogleDriveId(raw) {
            if (!raw) return '';
            let val = String(raw).trim();
            if (val.startsWith('hhttps://')) {
                val = val.replace('hhttps://', 'https://');
            }

            let id = '';
            const m = val.match(/\/file\/d\/([-\w]+)/i) ||
                      val.match(/\/d\/([-\w]+)/i) ||
                      val.match(/[?&]id=([-\w]+)/i) ||
                      val.match(/id=([-\w]+)/i);
            if (m && m[1]) {
                id = m[1].trim();
            } else {
                const rawMatch = val.match(/[-\w]{15,}/);
                if (rawMatch) {
                    id = rawMatch[0].trim();
                } else {
                    id = val;
                }
            }

            // Google Drive file IDs are standard 33 characters (e.g. 18f2-h5i1OBj0yQawljfNilHg2UMtiC0).
            // If user has an extra character or word appended at the end (e.g. 34 characters:
            // "1DlvdGn8QaXGuJVbeU6wrKxGUJfV-0Txh0" -> strip the trailing character to get 33 chars:
            if (id.length > 33) {
                id = id.slice(0, 33);
            } else if (id.length === 29) {
                id = id.slice(0, 28);
            }

            return id;
        }
        window.cleanGoogleDriveId = cleanGoogleDriveId;

        // Safely extract playable URL from episode string or object
        function extractEpisodeUrl(ep) {
            if (!ep) return '';
            if (typeof ep === 'string') return ep.trim();
            return String(
                ep.link || ep.url || ep.video || ep.videoUrl || ep.streamUrl ||
                ep.src || ep.file || ep.embed || ep.drive || ep.gdrive || ep.id || ''
            ).trim();
        }
        window.extractEpisodeUrl = extractEpisodeUrl;

        // Detect video source and type ('video', 'gdrive', 'yt', or 'drc')
        function detectMovieVideoSource(movie) {
            if (!movie) {
                return {
                    type: 'drc',
                    id: 'default',
                    url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4',
                    raw: ''
                };
            }

            // Parse episodes if provided as JSON string
            if (typeof movie.episodes === 'string' && movie.episodes.trim().startsWith('[')) {
                try {
                    movie.episodes = JSON.parse(movie.episodes);
                } catch (e) {}
            }

            const hasEpisodes = Array.isArray(movie.episodes) && movie.episodes.length > 0;

            let activeVideoSource = '';
            if (hasEpisodes) {
                const epIdx = window.currentActiveEpisodeIndex || 0;
                const currentEp = movie.episodes[epIdx] || movie.episodes[0];
                if (currentEp) {
                    activeVideoSource = extractEpisodeUrl(currentEp);
                }
            }

            if (!activeVideoSource) {
                activeVideoSource = String(movie.video || movie.videoUrl || movie.streamUrl || movie.link || movie.url || '').trim();
            }

            if (activeVideoSource.startsWith('hhttps://')) {
                activeVideoSource = activeVideoSource.replace('hhttps://', 'https://');
            }

            // 1. Google Drive Preview Links: ONLY when link is https://drive.google.com/file/d/.../preview
            const isDrivePreviewLink = activeVideoSource.startsWith('http') && (
                (activeVideoSource.includes('drive.google.com') && (activeVideoSource.includes('/preview') || activeVideoSource.includes('/view') || activeVideoSource.includes('/file/d/'))) ||
                (activeVideoSource.includes('docs.google.com') && activeVideoSource.includes('/preview'))
            );

            if (isDrivePreviewLink) {
                const driveId = cleanGoogleDriveId(activeVideoSource);
                const previewUrl = driveId
                    ? `https://drive.google.com/file/d/${driveId}/preview`
                    : (activeVideoSource.includes('/preview') ? activeVideoSource : `${activeVideoSource.replace(/\/view(\?.*)?$/i, '')}/preview`);
                return {
                    type: 'gdrive',
                    id: driveId || activeVideoSource,
                    url: previewUrl,
                    raw: activeVideoSource
                };
            }

            // 1.5 Cloudflare Worker Stream Links (e.g. workers.dev/?id=...)
            if (activeVideoSource.startsWith('http') && activeVideoSource.includes('workers.dev') && activeVideoSource.includes('id=')) {
                const driveId = cleanGoogleDriveId(activeVideoSource);
                const workerUrl = `https://debasis.installapkapps.workers.dev/?id=${encodeURIComponent(driveId)}`;
                return {
                    type: 'video',
                    id: driveId,
                    rawId: driveId,
                    url: workerUrl,
                    raw: activeVideoSource
                };
            }

            // 2. YouTube Video ID or URL
            const rawYt = String(movie.yt || movie.youtube || "").trim();
            if ((!hasEpisodes && rawYt) || activeVideoSource.includes('youtube.com') || activeVideoSource.includes('youtu.be')) {
                let ytId = (!hasEpisodes && rawYt) ? rawYt : '';
                const targetStr = ytId || activeVideoSource;
                const match = targetStr.match(/(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/i);
                if (match && match[1]) {
                    ytId = match[1];
                } else if (!ytId) {
                    ytId = targetStr;
                }
                return {
                    type: 'yt',
                    id: ytId,
                    url: `https://www.youtube.com/embed/${ytId}?autoplay=1&enablejsapi=1&rel=0&playsinline=1&modestbranding=1`,
                    raw: targetStr
                };
            }

            // 3. Raw Google Drive file ID (e.g. "1DlvdGn8QaXGuJVbeU6wrKxGUJfV-0Txh0" or 33-char ID)
            if (activeVideoSource && !activeVideoSource.startsWith('http') && /^[-\w]{15,}$/.test(activeVideoSource)) {
                const driveId = cleanGoogleDriveId(activeVideoSource);
                const workerUrl = `https://debasis.installapkapps.workers.dev/?id=${encodeURIComponent(driveId)}`;
                return {
                    type: 'video',
                    id: driveId,
                    rawId: driveId,
                    url: workerUrl,
                    raw: activeVideoSource
                };
            }

            // 4. Direct video URL (MP4, HLS, WebM, etc.)
            if (activeVideoSource && (activeVideoSource.startsWith('http://') || activeVideoSource.startsWith('https://'))) {
                return {
                    type: 'drc',
                    id: activeVideoSource,
                    url: activeVideoSource,
                    raw: activeVideoSource
                };
            }

            const rawDrc = String(movie.drc || movie.direct || "").trim();
            if (rawDrc) {
                return {
                    type: 'drc',
                    id: rawDrc,
                    url: rawDrc,
                    raw: rawDrc
                };
            }

            // Fallback safe sample stream
            return {
                type: 'video',
                id: '1DlvdGn8QaXGuJVbeU6wrKxGUJfV-0Txh',
                url: 'https://debasis.installapkapps.workers.dev/?id=1DlvdGn8QaXGuJVbeU6wrKxGUJfV-0Txh',
                raw: ''
            };
        }

        /* ====================================================
           CONTINUE WATCHING DATA STORE (MAX 10 POSTS)
           - User opens a post -> added to top
           - If already present -> moved to top (no duplicate)
           - Max 10 items -> oldest at the end is deleted
           - Persisted in localStorage
           ==================================================== */
        const CONTINUE_WATCHING_KEY = 'vdosky_continue_watching';

        function getContinueWatchingList() {
            try {
                const raw = localStorage.getItem(CONTINUE_WATCHING_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                }
                // Pre-seed with top 3 seed movies on first visit so Continue Watching is immediately visible at top
                const defaultList = (window.allMovies || allMovies || SEED_MOVIES).slice(0, 3);
                saveContinueWatchingList(defaultList);
                return defaultList;
            } catch (e) {
                console.warn("Failed to load continue watching list:", e);
                return (window.allMovies || allMovies || SEED_MOVIES).slice(0, 3);
            }
        }

        function saveContinueWatchingList(list) {
            try {
                localStorage.setItem(CONTINUE_WATCHING_KEY, JSON.stringify(list));
            } catch (e) {
                console.warn("Failed to save continue watching list:", e);
            }
        }

        function addToContinueWatching(movie) {
            if (!movie) return;
            try {
                let list = getContinueWatchingList();
                const targetKey = String(movie.id || movie.title || '').trim();

                // Remove existing entry if already in list to avoid duplicates
                list = list.filter(item => {
                    const itemKey = String(item.id || item.title || '').trim();
                    const itemTitle = String(item.title || '').trim().toLowerCase();
                    const movieTitle = String(movie.title || '').trim().toLowerCase();
                    return itemKey !== targetKey && itemTitle !== movieTitle;
                });

                // Add newly opened movie to the very front (index 0)
                list.unshift(movie);

                // Maximum 10 items: delete oldest from end
                if (list.length > 10) {
                    list = list.slice(0, 10);
                }

                saveContinueWatchingList(list);

                // Re-render home section if on home view so it updates immediately
                const homeSection = document.getElementById('homeMovieSection');
                if (homeSection && homeSection.style.display !== 'none' && typeof renderHomeMovieSection === 'function') {
                    renderHomeMovieSection(allMovies);
                }
            } catch (e) {
                console.error("Error in addToContinueWatching:", e);
            }
        }

        window.removeFromContinueWatching = function(encodedMovieId) {
            try {
                const targetId = decodeURIComponent(encodedMovieId);
                let list = getContinueWatchingList();
                list = list.filter(m => (m.id || m.title) !== targetId && m.title !== targetId);
                saveContinueWatchingList(list);
                renderHomeMovieSection(allMovies);
                showToast("Removed from Continue Watching");
            } catch (e) {
                console.error("Error removing item:", e);
            }
        };

        window.clearContinueWatching = function() {
            try {
                localStorage.removeItem(CONTINUE_WATCHING_KEY);
                renderHomeMovieSection(allMovies);
                showToast("Continue Watching cleared");
            } catch (e) {}
        };

        // Download index.html directly to device
        window.triggerDownloadIndex = function(e) {
            if (e) e.preventDefault();
            showToast("Starting download: index.html...");
            
            fetch('/download-index')
                .then(res => {
                    if (res.ok) return res.blob();
                    throw new Error("Direct route unavailable");
                })
                .then(blob => {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'index.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 3000);
                    showToast("Downloaded index.html successfully!");
                })
                .catch(() => {
                    // Client-side fallback if server route not reached
                    const fullHtml = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
                    const blob = new Blob([fullHtml], { type: 'text/html; charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'index.html';
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 3000);
                    showToast("Downloaded index.html successfully!");
                });
        };

            if (window.currentPlyrInstance) {
                try {
                    window.currentPlyrInstance.destroy();
                } catch (e) {}
                window.currentPlyrInstance = null;
            }
        }

        function initPlyrPlayer(videoEl) {
            if (!videoEl) return;
            const PlyrConstructor = window.Plyr;
            if (!PlyrConstructor) {
                console.warn("Plyr CDN not loaded, fallback to native controls");
                videoEl.controls = true;
                videoEl.play().catch(() => {});
                return;
            }

            try {
                window.currentPlyrInstance = new PlyrConstructor(videoEl, {
                    controls: [
                        'play-large',
                        'rewind',
                        'play',
                        'fast-forward',
                        'progress',
                        'current-time',
                        'duration',
                        'mute',
                        'volume',
                        'fullscreen'
                    ],
                    seekTime: 10,
                    keyboard: { focused: true, global: false },
                    tooltips: { controls: true, seek: true },
                    fullscreen: { enabled: true, fallback: true, iosNative: true },
                    autoplay: true
                });

                window.currentPlyrInstance.on('ready', () => {
                    window.currentPlyrInstance.play().catch(() => {});
                });

                window.currentPlyrInstance.on('error', () => {
                    const errBox = document.getElementById('playerStreamErrorNotice');
                    if (errBox) errBox.style.display = 'flex';
                });
            } catch (err) {
                console.error("Error creating Plyr instance:", err);
                videoEl.controls = true;
            }
        }

        /* ====================================================
           PLAYER & PLAYLIST SYSTEM
           ==================================================== */

        // Play Movie or Series from encoded data
        window.playMovieFromData = function(encodedMovieJson) {
            try {
                const movie = JSON.parse(decodeURIComponent(encodedMovieJson));
                window.openPlayer(movie);
            } catch (e) {
                console.error("Error launching movie:", e);
            }
        };

        // Open Player Modal
        window.openPlayer = function(movie) {
            currentPlayingMovie = movie;
            currentActiveServer = 0;
            window.currentActiveEpisodeIndex = 0;

            // Automatically add to Continue Watching (Max 10, newest at front, oldest removed)
            addToContinueWatching(movie);

            const modal = document.getElementById('playerModal');
            const titleEl = document.getElementById('playerMovieTitle');
            const topTitle = document.getElementById('topBarPlayerTitle');
            const ratingEl = document.getElementById('playerRating');
            const catEl = document.getElementById('playerCategory');
            const castBox = document.getElementById('playerCastBox');
            const relatedRow = document.getElementById('playerRelatedRow');

            if (!modal) return;

            const title = movie.title || 'Movie';
            if (titleEl) titleEl.textContent = title;
            if (topTitle) topTitle.textContent = title;
            if (ratingEl) ratingEl.textContent = `★ ${movie.rating || '4.8'}`;
            if (catEl) catEl.textContent = movie.category || 'General';

            // Cast pills
            if (castBox) {
                if (movie.cast) {
                    const stars = movie.cast.split(',').map(s => s.trim()).filter(Boolean);
                    castBox.innerHTML = `<strong>Starring:</strong> ` + stars.map(star => `
                        <span class="cast-pill" onclick="window.searchByCast('${star.replace(/'/g, "\\'")}')">
                            <i class="fa-solid fa-user"></i> ${star}
                        </span>
                    `).join('');
                } else {
                    castBox.innerHTML = `<strong>Starring:</strong> General Cast`;
                }
            }

            // Parse & render Playlist if Web Series has episodes
            setupWebSeriesPlaylist(movie);

            // Fetch and render stream servers with Plyr
            renderCurrentStream();

            // Related Movies
            if (relatedRow) {
                const related = allMovies
                    .filter(m => m.category === movie.category && m.title !== movie.title)
                    .slice(0, 10);
                if (related.length > 0) {
                    relatedRow.innerHTML = related.map(m => createMovieCardHtml(m)).join('');
                } else {
                    relatedRow.innerHTML = allMovies.slice(0, 10).map(m => createMovieCardHtml(m)).join('');
                }
            }

            modal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
            showToast(`Playing: ${title}`);
        };

        // Setup Web Series Playlist UI
        function setupWebSeriesPlaylist(movie) {
            const playlistSection = document.getElementById('playlistSection');
            const episodesBadge = document.getElementById('playerEpisodesCountBadge');
            const playlistGrid = document.getElementById('playlistEpisodesGrid');
            const playlistCountBadge = document.getElementById('playlistCountBadge');
            const filterBar = document.getElementById('playlistFilterBar');
            const filterInput = document.getElementById('playlistFilterInput');

            if (!playlistSection) return;

            // Ensure episodes is array if stringified JSON
            if (typeof movie.episodes === 'string' && movie.episodes.trim().startsWith('[')) {
                try {
                    movie.episodes = JSON.parse(movie.episodes);
                } catch (e) {}
            }

            const isSeries = Boolean((movie.episodes && movie.episodes.length > 0) || (movie.category && movie.category.toLowerCase().includes('series')));

            // If it's a web series but has no episodes array, synthesize Season 1 playlist so buttons are ALWAYS available
            if (isSeries && (!Array.isArray(movie.episodes) || movie.episodes.length === 0)) {
                const baseLink = movie.video || movie.url || movie.streamUrl || '1naJKcHY6Jlx2z6zm3fp02mg4uzOviwF8';
                movie.episodes = [
                    { title: "Episode 1", link: baseLink },
                    { title: "Episode 2", link: "1DlvdGn8QaXGuJVbeU6wrKxGUJfV-0Txh0" },
                    { title: "Episode 3", link: "1Avynn1fZh2M9Fh-MpTdJPGuAin0GY3la" },
                    { title: "Episode 4", link: "12Ka6aLRVOuVij9Q-ajVbYzJDbQtpT4ii" },
                    { title: "Episode 5", link: "1foS5W2Dm_GV3t5bHRxKLOKQ0gUMEptYq" },
                    { title: "Episode 6", link: "1WD1TdrgUSNn_xgiiqYRx4qvIqgAOkiE-" }
                ];
            }

            const hasEpisodes = Array.isArray(movie.episodes) && movie.episodes.length > 0;

            if (hasEpisodes) {
                playlistSection.style.display = 'block';
                if (episodesBadge) {
                    episodesBadge.style.display = 'inline-block';
                    episodesBadge.textContent = `${movie.episodes.length} Episodes`;
                }
                if (playlistCountBadge) {
                    playlistCountBadge.textContent = `${movie.episodes.length} Episodes`;
                }
                if (filterBar) {
                    filterBar.style.display = movie.episodes.length > 6 ? 'block' : 'none';
                    if (filterInput) filterInput.value = '';
                }

                // Render episode pill buttons
                if (playlistGrid) {
                    playlistGrid.innerHTML = movie.episodes.map((ep, idx) => {
                        const epTitle = (typeof ep === 'object' && ep ? (ep.title || ep.name) : '') || `Episode ${idx + 1}`;
                        const isActive = idx === window.currentActiveEpisodeIndex;
                        const epLink = extractEpisodeUrl(ep);
                        const isEpYt = epLink.includes('youtube.com') || epLink.includes('youtu.be');
                        const isEpDrivePreview = epLink.includes('drive.google.com');
                        const sourceTag = isEpYt ? 'YouTube Cloud' : (isEpDrivePreview ? 'Drive Preview' : 'Plyr HD Stream');

                        return `
                            <button type="button" class="episode-pill-btn ${isActive ? 'active' : ''}" onclick="window.switchEpisode(${idx})" data-ep-title="${epTitle.toLowerCase()}" data-ep-num="${idx + 1}">
                                <div class="ep-num-tag">${idx + 1}</div>
                                <div class="ep-details">
                                    <span class="ep-title" title="${epTitle}">${epTitle}</span>
                                    <span class="ep-source-tag">${sourceTag}</span>
                                </div>
                                ${isActive ? '<span class="ep-active-indicator"><i class="fa-solid fa-circle-play"></i></span>' : '<i class="fa-solid fa-play ep-play-icon"></i>'}
                            </button>
                        `;
                    }).join('');
                }

                updatePlaylistNavControls();
            } else {
                playlistSection.style.display = 'none';
                if (episodesBadge) episodesBadge.style.display = 'none';
            }
        }

        // Render current stream and server selector buttons
        function renderCurrentStream() {
            if (!currentPlayingMovie) return;

            const servers = getMovieServers(currentPlayingMovie);
            const targetServer = servers[currentActiveServer] || servers[0];

            renderPlayerVideo(targetServer);

            // Render Server buttons
            const serversContainer = document.getElementById('serverPillsContainer');
            if (serversContainer) {
                serversContainer.innerHTML = servers.map((s, idx) => `
                    <button class="server-btn ${idx === currentActiveServer ? 'active' : ''}" onclick="window.switchServer(${idx})">
                        <i class="fa-solid ${s.type === 'yt' ? 'fa-brands fa-youtube' : s.type === 'gdrive' ? 'fa-cloud' : 'fa-play'}"></i> ${s.name}
                    </button>
                `).join('');
            }
        }

        // Render Plyr video element or iframe into player box
        function renderPlayerVideo(source) {
            const videoBox = document.getElementById('videoBoxWrapper');
            if (!videoBox || !source) return;

            destroyCurrentPlyr();

            // Direct Video & Worker CDN: initialize Plyr Player!
            if (source.type === 'video' || source.type === 'drc') {
                videoBox.innerHTML = `
                    <video id="vdoSkyPlyr" class="player" playsinline controls preload="metadata" poster="${currentPlayingMovie?.poster || ''}">
                        <source src="${source.url}" type="video/mp4">
                        Your browser does not support HTML5 video.
                    </video>
                    <!-- Stream Error Fallback Notice -->
                    <div id="playerStreamErrorNotice" style="display: none; position: absolute; inset: 0; background: rgba(10,12,18,0.94); z-index: 30; flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;">
                        <i class="fa-solid fa-triangle-exclamation" style="font-size: 34px; color: #ffb703; margin-bottom: 10px;"></i>
                        <h3 style="font-size: 15px; font-weight: bold; margin-bottom: 6px; color: #fff;">Stream Loading Interrupted</h3>
                        <p style="font-size: 12px; color: #8b949e; margin-bottom: 14px; max-width: 300px;">
                            This server is taking longer than expected. Switch to another mirror to continue.
                        </p>
                        <button onclick="window.switchServer((currentActiveServer + 1) % 3)" style="background: #00d2ff; color: #0b0e14; font-weight: 700; border: none; padding: 8px 18px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;">
                            <i class="fa-solid fa-rotate"></i> Try Next Server
                        </button>
                    </div>
                `;
                const videoEl = document.getElementById('vdoSkyPlyr');
                if (videoEl) {
                    initPlyrPlayer(videoEl);
                }
            } else {
                // Google Drive Preview or YouTube Embed
                videoBox.innerHTML = `
                    <iframe id="activePlayerIframe" class="player" src="${source.url}" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen" 
                            allowfullscreen
                            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; margin: 0; padding: 0; background: #000;">
                    </iframe>
                `;
            }
        }

        // Switch Episode in Web Series Playlist
        window.switchEpisode = function(epIdx) {
            if (!currentPlayingMovie || !currentPlayingMovie.episodes) return;
            const episodes = currentPlayingMovie.episodes;
            if (epIdx < 0 || epIdx >= episodes.length) return;

            window.currentActiveEpisodeIndex = epIdx;
            currentActiveServer = 0;

            const targetEp = episodes[epIdx];
            const epTitle = (typeof targetEp === 'object' && targetEp ? (targetEp.title || targetEp.name) : '') || `Episode ${epIdx + 1}`;

            // Update title
            const titleEl = document.getElementById('playerMovieTitle');
            const topTitle = document.getElementById('topBarPlayerTitle');
            const fullTitle = `${currentPlayingMovie.title || 'Series'} - ${epTitle}`;
            if (titleEl) titleEl.textContent = fullTitle;
            if (topTitle) topTitle.textContent = fullTitle;

            // Update Now Playing indicator
            const nowPlayingEl = document.getElementById('playlistNowPlayingTitle');
            if (nowPlayingEl) nowPlayingEl.textContent = epTitle;

            // Update episode pills active state
            const grid = document.getElementById('playlistEpisodesGrid');
            if (grid) {
                grid.querySelectorAll('.episode-pill-btn').forEach((btn, idx) => {
                    const isActive = idx === epIdx;
                    btn.classList.toggle('active', isActive);
                    const indicator = btn.querySelector('.ep-active-indicator');
                    const playIcon = btn.querySelector('.ep-play-icon');
                    if (isActive) {
                        if (!indicator) {
                            if (playIcon) playIcon.remove();
                            btn.insertAdjacentHTML('beforeend', '<span class="ep-active-indicator"><i class="fa-solid fa-circle-play"></i></span>');
                        }
                    } else {
                        if (indicator) indicator.remove();
                        if (!btn.querySelector('.ep-play-icon')) {
                            btn.insertAdjacentHTML('beforeend', '<i class="fa-solid fa-play ep-play-icon"></i>');
                        }
                    }
                });
                const activeBtn = grid.querySelector(`.episode-pill-btn[data-ep-num="${epIdx + 1}"]`);
                if (activeBtn) {
                    activeBtn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
                }
            }

            updatePlaylistNavControls();
            renderCurrentStream();
            showToast(`Playing: ${epTitle}`);
        };

        // Update Prev/Next button states
        function updatePlaylistNavControls() {
            if (!currentPlayingMovie || !currentPlayingMovie.episodes) return;
            const curIdx = window.currentActiveEpisodeIndex || 0;
            const total = currentPlayingMovie.episodes.length;
            const prevBtn = document.getElementById('prevEpBtn');
            const nextBtn = document.getElementById('nextEpBtn');
            const nowPlayingEl = document.getElementById('playlistNowPlayingTitle');

            if (prevBtn) prevBtn.disabled = curIdx <= 0;
            if (nextBtn) nextBtn.disabled = curIdx >= total - 1;

            const targetEp = currentPlayingMovie.episodes[curIdx];
            const epTitle = (typeof targetEp === 'object' && targetEp ? (targetEp.title || targetEp.name) : '') || `Episode ${curIdx + 1}`;
            if (nowPlayingEl) nowPlayingEl.textContent = epTitle;
        }

        window.goToPrevEpisode = function() {
            if (!currentPlayingMovie || !currentPlayingMovie.episodes) return;
            const cur = window.currentActiveEpisodeIndex || 0;
            if (cur > 0) {
                window.switchEpisode(cur - 1);
            }
        };

        window.goToNextEpisode = function() {
            if (!currentPlayingMovie || !currentPlayingMovie.episodes) return;
            const cur = window.currentActiveEpisodeIndex || 0;
            if (cur < currentPlayingMovie.episodes.length - 1) {
                window.switchEpisode(cur + 1);
            }
        };

        // Filter episodes in playlist
        window.filterPlaylistEpisodes = function(query) {
            const q = (query || '').toLowerCase().trim();
            const pills = document.querySelectorAll('#playlistEpisodesGrid .episode-pill-btn');
            pills.forEach(btn => {
                const title = btn.getAttribute('data-ep-title') || '';
                const num = btn.getAttribute('data-ep-num') || '';
                const match = !q || title.includes(q) || num.includes(q);
                btn.style.display = match ? 'flex' : 'none';
            });
        };

        // Switch server mirror
        window.switchServer = function(serverIdx) {
            if (!currentPlayingMovie) return;
            currentActiveServer = serverIdx;
            const servers = getMovieServers(currentPlayingMovie);
            const target = servers[serverIdx] || servers[0];

            document.querySelectorAll('.server-btn').forEach((btn, idx) => {
                btn.classList.toggle('active', idx === serverIdx);
            });

            // If already in Plyr and target is also direct video, smoothly switch source
            const plyrVideo = document.getElementById('vdoSkyPlyr');
            if (window.currentPlyrInstance && plyrVideo && (target.type === 'video' || target.type === 'drc')) {
                window.currentPlyrInstance.source = {
                    type: 'video',
                    title: currentPlayingMovie.title || 'Movie',
                    sources: [{ src: target.url, type: 'video/mp4' }],
                    poster: currentPlayingMovie.poster || ''
                };
                window.currentPlyrInstance.play().catch(() => {});
            } else {
                renderPlayerVideo(target);
            }

            showToast(`Switched to: ${target.name}`);
        };

        // Close Player Modal
        window.closePlayer = function() {
            destroyCurrentPlyr();
            const modal = document.getElementById('playerModal');
            const videoBox = document.getElementById('videoBoxWrapper');
            if (videoBox) videoBox.innerHTML = '';
            if (modal) modal.style.display = 'none';
            document.body.style.overflow = '';
            currentPlayingMovie = null;

            // Re-render home section so Continue Watching updates immediately
            if (typeof renderHomeMovieSection === 'function') {
                renderHomeMovieSection(allMovies);
            }
        };

        // Share Link
        window.shareCurrentMovie = function() {
            if (!currentPlayingMovie) return;
            const shareTitle = currentPlayingMovie.title || 'Movie';
            const shareUrl = window.location.href;

            if (navigator.share) {
                navigator.share({
                    title: shareTitle,
                    text: `Watch ${shareTitle} on VDOSky:`,
                    url: shareUrl
                }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(`${shareTitle}: ${shareUrl}`).then(() => {
                    showToast("Movie link copied to clipboard!");
                });
            } else {
                showToast(`Share: ${shareTitle}`);
            }
        };

        /* ====================================================
           SEARCH & VOICE SEARCH
           ==================================================== */
        let searchTimer = null;
        window.handleSearchInput = function(e) {
            const query = (e.target.value || '').trim();
            const clearBtn = document.getElementById('searchClearBtn');
            if (clearBtn) clearBtn.style.display = query ? 'block' : 'none';

            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                performSearch(query);
            }, 180);
        };

        window.clearSearch = function() {
            const searchInput = document.getElementById('searchInput');
            const clearBtn = document.getElementById('searchClearBtn');
            if (searchInput) {
                searchInput.value = '';
                searchInput.focus();
            }
            if (clearBtn) clearBtn.style.display = 'none';
            window.goHome();
        };

        function performSearch(query) {
            if (!query) {
                window.goHome();
                return;
            }

            const q = query.toLowerCase();
            const matched = allMovies.filter(m => {
                const title = (m.title || '').toLowerCase();
                const cast = (m.cast || '').toLowerCase();
                const category = (m.category || '').toLowerCase();
                return title.includes(q) || cast.includes(q) || category.includes(q);
            });

            const homeSection = document.getElementById('homeMovieSection');
            const gridSection = document.getElementById('categoryGridView');
            const titleEl = document.getElementById('gridCategoryTitle');
            const countEl = document.getElementById('gridCategoryCount');
            const gridCards = document.getElementById('categoryGridMovies');

            if (homeSection) homeSection.style.display = 'none';
            if (gridSection) gridSection.style.display = 'block';

            if (titleEl) titleEl.innerHTML = `<i class="fa-solid fa-magnifying-glass"></i> "${query}"`;
            if (countEl) countEl.textContent = `${matched.length} Results`;
            if (gridCards) {
                if (matched.length > 0) {
                    gridCards.innerHTML = matched.map(m => createMovieCardHtml(m)).join('');
                } else {
                    gridCards.innerHTML = `
                        <div style="grid-column: 1 / -1; text-align: center; padding: 50px 20px; color: #8b949e;">
                            <i class="fa-solid fa-film" style="font-size: 40px; margin-bottom: 12px; color: #30363d;"></i>
                            <h3 style="color: #fff; margin-bottom: 6px;">No movies or series found</h3>
                            <p style="font-size: 13px;">Try searching by movie title, web series name, or actor.</p>
                        </div>
                    `;
                }
            }
        }

        window.searchByCast = function(actor) {
            window.closePlayer();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.value = actor;
            performSearch(actor);
        };

        // Voice Search (Web Speech API)
        window.startVoiceSearch = function() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                showToast("Voice search not supported in this browser");
                return;
            }

            const micBtn = document.getElementById('micBtn');
            const searchInput = document.getElementById('searchInput');
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                if (micBtn) micBtn.classList.add('listening');
                showToast("Listening... Speak now");
            };

            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                if (searchInput) {
                    searchInput.value = text;
                    const clearBtn = document.getElementById('searchClearBtn');
                    if (clearBtn) clearBtn.style.display = 'block';
                }
                showToast(`Searched: "${text}"`);
                performSearch(text);
            };

            recognition.onerror = () => {
                if (micBtn) micBtn.classList.remove('listening');
                showToast("Microphone error or permission denied");
            };

            recognition.onend = () => {
                if (micBtn) micBtn.classList.remove('listening');
            };

            try {
                recognition.start();
            } catch(e) {}
        };

        window.toggleCategoryMenu = function() {
            const bar = document.getElementById('categoryPillsBar');
            if (bar) {
                bar.scrollIntoView({ behavior: 'smooth' });
                showToast("Select a genre or web series above");
            }
        };

        /* ====================================================
           CATALOG LOADING & AUTO HEALING
           ==================================================== */
        function processCatalogData(items) {
            if (!Array.isArray(items)) return [];
            return items.map((item, idx) => {
                let eps = item.episodes;
                if (typeof eps === 'string' && eps.trim().startsWith('[')) {
                    try { eps = JSON.parse(eps); } catch (e) {}
                }
                const cat = String(item.category || '').toLowerCase();
                const isSeries = cat.includes('series') || String(item.title || '').toLowerCase().includes('season');
                
                // If Web Series and no episodes defined, provide default playlist
                if (isSeries && (!Array.isArray(eps) || eps.length === 0)) {
                    const baseLink = item.video || item.url || item.streamUrl || item.link || '1naJKcHY6Jlx2z6zm3fp02mg4uzOviwF8';
                    eps = [
                        { title: "Episode 1", link: baseLink },
                        { title: "Episode 2", link: "1DlvdGn8QaXGuJVbeU6wrKxGUJfV-0Txh0" },
                        { title: "Episode 3", link: "1Avynn1fZh2M9Fh-MpTdJPGuAin0GY3la" },
                        { title: "Episode 4", link: "12Ka6aLRVOuVij9Q-ajVbYzJDbQtpT4ii" },
                        { title: "Episode 5", link: "1foS5W2Dm_GV3t5bHRxKLOKQ0gUMEptYq" },
                        { title: "Episode 6", link: "1WD1TdrgUSNn_xgiiqYRx4qvIqgAOkiE-" }
                    ];
                }

                return {
                    ...item,
                    episodes: Array.isArray(eps) && eps.length > 0 ? eps : undefined
                };
            });
        }

        async function loadCatalog() {
            renderHomeMovieSection(allMovies);
            renderCategoryPills(allMovies);

            const GITHUB_URL = "https://raw.githubusercontent.com/appcreator05/post/refs/heads/main/8468988.json";
            const LOCAL_CATALOG = "./catalog.json";

            // 1. Load local catalog.json
            try {
                const res = await fetch(LOCAL_CATALOG);
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length > 0) {
                        allMovies = processCatalogData(data);
                        window.allMovies = allMovies;
                        renderHomeMovieSection(allMovies);
                        renderCategoryPills(allMovies);
                    }
                }
            } catch (e) {}

            // 2. Sync fresh live catalog from GitHub
            try {
                const res = await fetch(GITHUB_URL + `?_t=${Date.now()}`);
                if (res.ok) {
                    const freshData = await res.json();
                    if (Array.isArray(freshData) && freshData.length > 0) {
                        allMovies = processCatalogData(freshData);
                        window.allMovies = allMovies;
                        renderHomeMovieSection(allMovies);
                        renderCategoryPills(allMovies);
                    }
                }
            } catch (err) {
                console.warn("Using offline catalog cache.");
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadCatalog();
        });
    </script>
</body>
